<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N3 단어장</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1f1d1a;--muted:#7a756c;--line:#e4dfd5;--accent:#c0392b;--ok:#2e7d4f;--no:#b23a2e;}
  @media (prefers-color-scheme:dark){:root{--bg:#191816;--card:#24221f;--ink:#f0ece4;--muted:#a39d92;--line:#3a3732;--accent:#e06656;--ok:#4fae78;--no:#e0665a;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Hiragino Sans",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:inherit;font:inherit}
  .set b{display:block;font-size:15px}
  .set span{color:var(--muted);font-size:12px}
  .set.done{border-color:var(--ok)}
  .set.done span{color:var(--ok)}
  .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
  .link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:4px 0}
  .meta{color:var(--muted);font-size:13px;text-align:right}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 16px 28px;text-align:center}
  .kanji{font-size:56px;font-weight:600;letter-spacing:2px;word-break:keep-all;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .reveal{min-height:64px;margin-top:14px}
  .kana{font-size:22px;color:var(--accent)}
  .ko{font-size:18px;margin-top:4px}
  .row{display:flex;gap:10px;margin-top:14px}
  .row button{flex:1;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
  .row button.on{border-color:var(--accent);color:var(--accent)}
  .row .no{background:var(--no);border-color:var(--no);color:#fff}
  .row .ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center}
  .msg h2{margin:0 0 8px;font-size:20px}
  .msg p{color:var(--muted);margin:0 0 18px}
  .primary{padding:14px 20px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:16px;cursor:pointer;width:100%}
  textarea{width:100%;min-height:220px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace}
  details{margin-top:24px;color:var(--muted)}
  details summary{cursor:pointer}
  .small{font-size:12px;color:var(--muted)}
  kbd{font:12px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.6;margin:0 2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- 홈 -->
  <section id="home">
    <h1>JLPT N3 단어장</h1>
    <div class="sub" id="summary"></div>
    <div class="sets" id="sets"></div>
    <details>
      <summary>단어 불러오기 / 초기화</summary>
      <p class="small">한 줄에 하나씩 <b>한자,히라가나,뜻</b> (쉼표 또는 탭 구분). 불러오면 진행 기록이 초기화돼요.</p>
      <textarea id="importBox" placeholder="経験,けいけん,경험&#10;準備,じゅんび,준비"></textarea>
      <div class="row">
        <button id="importBtn">불러오기</button>
        <button id="resetBtn">진행 기록 초기화</button>
      </div>
      <p class="small" id="importMsg"></p>
    </details>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" hidden>
    <div class="top">
      <button class="link" id="backBtn">← 목록 (자동 저장됨)</button>
      <div class="meta" id="qmeta"></div>
    </div>
    <div class="card">
      <div class="kanji" id="kanji"></div>
      <div class="reveal">
        <div class="kana" id="kana" hidden></div>
        <div class="ko" id="ko" hidden></div>
      </div>
    </div>
    <div class="row">
      <button id="showKana">히라가나 <kbd>1</kbd></button>
      <button id="showKo">한국어 <kbd>2</kbd></button>
    </div>
    <div class="row">
      <button class="no" id="noBtn"><kbd>←</kbd> 모르겠음</button>
      <button class="ok" id="okBtn">알겠음 <kbd>→</kbd></button>
    </div>
  </section>

  <!-- 라운드 사이 안내 -->
  <section id="between" hidden>
    <div class="msg">
      <h2 id="bTitle"></h2>
      <p id="bText"></p>
      <button class="primary" id="bBtn"></button>
    </div>
  </section>

</div>

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function parse(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,/).map(s => s.trim());
    return { kanji: p[0], kana: p[1] || '', ko: p.slice(2).join(', ') };
  }).filter(w => w.kanji);
}

let words = load(KEY_WORDS, null) || DEFAULT_WORDS;
let state = load(KEY_STATE, {});   // setIndex -> 진행 상태
let cur = null;                    // 현재 세트 번호

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const setCount = () => Math.ceil(words.length / SET_SIZE);
const setIds = s => Array.from({ length: Math.min(SET_SIZE, words.length - s * SET_SIZE) }, (_, i) => s * SET_SIZE + i);

/*
 세트 상태
  round      : 몇 회독째 (1~7)
  pass       : 이번 회독 안에서 몇 번째 사이클 (1 = 첫 사이클, 2+ = 틀린 것 반복)
  queue      : 이번 사이클에 남은 문제
  wrong      : 이번 사이클에서 틀린 문제
  firstWrong : 이번 회독 첫 사이클에서 틀린 문제 → 다음 회독 범위
  done       : 세트 완료
*/
function newRound(round, pool) {
  return { round, pass: 1, queue: shuffle(pool), wrong: [], firstWrong: [], total: pool.length, done: false };
}
function getState(s) {
  if (!state[s]) state[s] = newRound(1, setIds(s));
  return state[s];
}

function renderHome() {
  $('home').hidden = false; $('quiz').hidden = true; $('between').hidden = true;
  const n = setCount();
  const doneCount = Object.values(state).filter(x => x.done).length;
  $('summary').textContent = `총 ${words.length}단어 · ${n}세트 · 완료 ${doneCount}/${n}`;
  $('sets').innerHTML = '';
  for (let s = 0; s < n; s++) {
    const ids = setIds(s), st = state[s];
    const b = document.createElement('button');
    b.className = 'set' + (st && st.done ? ' done' : '');
    let label = '시작 전', pct = 0;
    if (st && st.done) { label = `완료 (${st.round}회독)`; pct = 100; }
    else if (st) {
      label = `${st.round}회독` + (st.pass > 1 ? ` · 오답 ${st.pass - 1}차` : '') + ` · 남은 ${st.queue.length}`;
      pct = Math.round((st.total - st.queue.length) / st.total * 100);
    }
    b.innerHTML = `<b>${ids[0] + 1}–${ids[ids.length - 1] + 1}</b><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div>`;
    b.onclick = () => openSet(s);
    $('sets').appendChild(b);
  }
}

function openSet(s) {
  cur = s;
  const st = getState(s);
  if (st.done) {
    between('완료한 세트예요', `${st.round}회독까지 마쳤어요. 처음부터 다시 할까요?`, '다시 시작', () => {
      state[s] = newRound(1, setIds(s)); save(KEY_STATE, state); showCard();
    });
    return;
  }
  save(KEY_STATE, state);
  showCard();
}

function showCard() {
  const st = state[cur];
  $('home').hidden = true; $('between').hidden = true; $('quiz').hidden = false;
  const w = words[st.queue[0]];
  $('kanji').textContent = w.kanji;
  $('kana').textContent = w.kana; $('ko').textContent = w.ko;
  $('kana').hidden = true; $('ko').hidden = true;
  $('showKana').classList.remove('on'); $('showKo').classList.remove('on');
  const passLabel = st.pass === 1 ? '' : ` · 오답 ${st.pass - 1}차`;
  const answered = (st.pass === 1 ? st.total : st.queueLen || st.queue.length) - st.queue.length;
  $('qmeta').textContent = `세트 ${cur + 1} · ${st.round}/${MAX_ROUND}회독${passLabel}\n${answered + 1} / ${st.pass === 1 ? st.total : st.queueLen}`;
  $('qmeta').style.whiteSpace = 'pre-line';
}

function answer(known) {
  const st = state[cur];
  const id = st.queue.shift();
  if (!known) {
    st.wrong.push(id);
    if (st.pass === 1) st.firstWrong.push(id);
  }
  if (st.queue.length) { save(KEY_STATE, state); showCard(); return; }
  endPass();
}

function endPass() {
  const st = state[cur];
  if (st.wrong.length) {
    // 틀린 것만 다시, 다 맞출 때까지
    const n = st.wrong.length;
    st.pass++; st.queue = shuffle(st.wrong); st.queueLen = n; st.wrong = [];
    save(KEY_STATE, state);
    between(`${n}개 틀렸어요`, '틀린 단어만 다시 풀어요. 다 맞춰야 이번 회독을 탈출할 수 있어요.', '오답 다시 풀기', showCard);
    return;
  }
  // 이번 회독 탈출
  const next = st.firstWrong;
  if (!next.length || st.round >= MAX_ROUND) {
    st.done = true; save(KEY_STATE, state);
    const why = !next.length ? `${st.round}회독 첫 사이클에서 전부 맞췄어요!` : `${MAX_ROUND}회독을 모두 마쳤어요!`;
    between('세트 완료 🎉', why, '목록으로', renderHome);
    return;
  }
  const r = st.round;
  state[cur] = newRound(r + 1, next);
  save(KEY_STATE, state);
  between(`${r}회독 탈출!`, `${r}회독 첫 사이클에서 틀렸던 ${next.length}개로 ${r + 1}회독을 시작해요.`, `${r + 1}회독 시작`, showCard);
}

function between(title, text, btn, fn) {
  $('home').hidden = true; $('quiz').hidden = true; $('between').hidden = false;
  $('bTitle').textContent = title; $('bText').textContent = text; $('bBtn').textContent = btn;
  $('bBtn').onclick = fn;
}

$('showKo').onclick = () => { $('ko').hidden = !$('ko').hidden; $('showKo').classList.toggle('on'); };
$('okBtn').onclick = () => answer(true);

// 단축키: 1 히라가나 / 2 한국어 / ← 모르겠음 / → 알겠음 / Enter·Space 안내 화면 넘기기
document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'TEXTAREA') return;
  if (!$('quiz').hidden) {
    const btn = { '1': 'showKana', '2': 'showKo', ArrowLeft: 'noBtn', ArrowRight: 'okBtn' }[e.key];
    if (btn) { e.preventDefault(); $(btn).onclick(); }
  } else if (!$('between').hidden && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); $('bBtn').onclick();
  }
});
// 버튼에 포커스가 남아 Space/Enter가 두 번 눌리는 것 방지
document.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => b.blur()));

  if (!resetArmed) { resetArmed = true; $('resetBtn').textContent = '한 번 더 누르면 초기화'; return; }
  state = {}; save(KEY_STATE, state); resetArmed = false; $('resetBtn').textContent = '진행 기록 초기화';
  $('importMsg').textContent = '진행 기록을 초기화했어요.'; renderHome();
};
$('importBtn').onclick = () => {
  const list = parse($('importBox').value);
  if (!list.length) { $('importMsg').textContent = '읽을 수 있는 단어가 없어요.'; return; }
  words = list; state = {}; save(KEY_WORDS, words); save(KEY_STATE, state);
  $('importMsg').textContent = `${list.length}개 단어를 불러왔어요.`; $('importBox').value = ''; renderHome();
};

renderHome();
</script>
</body>
</html>
